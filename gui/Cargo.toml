[package]
name = "gui"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
default-run = "los-gui"
[dependencies]
derive_builder = "0.20.0"
eframe = { version = "0.27.2" }
egui = "0.27.2"
json-gettext = "4.0.10"
log = "0.4.21"
simple_logger = "4.3.3"
solvers = { path = "../solvers" }

[[bin]]
name = "los-gui"
path = "src/main.rs"
