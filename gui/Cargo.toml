[package]
name = "gui"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
default-run = "los-gui"
[dependencies]
eframe = { version = "0.27.2" }   #features = ["default_fonts", "wayland", "x11"]
egui = "0.27.2"
log = "0.4.21"
simple_logger = "4.3.3"
solvers = { path = "../solvers" }

[[bin]]
name = "los-gui"
path = "src/main.rs"
